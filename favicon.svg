<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#182032" />
      <stop offset="85%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <!-- Glowing Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f38020" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Lightning Energy Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#f38020" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" />

  <!-- Outer Neon Ring (Similar to Kokkanotenbin & KR circle aesthetic) -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#ringGrad)" stroke-width="24" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#ringGrad)" stroke-width="20" stroke-linecap="round" />

  <!-- Antigravity Orbit Ring (Planetary / Floating Feel) -->
  <ellipse cx="256" cy="256" rx="175" ry="60" fill="none" stroke="#38bdf8" stroke-width="12" stroke-dasharray="24 16" transform="rotate(-30 256 256)" opacity="0.85" />

  <!-- Central Sharp Energy Lightning Bolt (Signifying Prompts & Antigravity) -->
  <polygon points="275,85 160,265 245,265 210,430 355,230 265,230" fill="url(#boltGrad)" filter="url(#neonGlow)" />
  <polygon points="275,85 160,265 245,265 210,430 355,230 265,230" fill="url(#boltGrad)" />

  <!-- Core Hotspot Sparkle -->
  <circle cx="260" cy="245" r="14" fill="#ffffff" filter="url(#neonGlow)" />
</svg>
